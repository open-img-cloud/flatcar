name: Build & publish image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override the Flatcar Stable version (e.g. 4757.2.3); otherwise derived from the tag, falling back to VERSION'
        required: false
      publish:
        description: 'If false, skip upload + CF purge (dry-run validation)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write   # cosign keyless via GitHub OIDC

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.version }}" ]]; then
            v="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            v=$(tr -d '[:space:]' < VERSION)
          fi
          if [[ ! "$v" =~ ^[0-9]+\.2\.[0-9]+$ ]]; then
            echo "::error::version '$v' is not a Flatcar Stable release (e.g. 4757.2.3)"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # The upstream OpenStack image, republished byte for byte: its signed digests
  # are verified against the Flatcar image signing key (primary key pinned
  # below, subkeys rotate yearly), then the published file must keep the
  # upstream hash. The same file serves Proxmox VE with a configdrive2
  # cloud-init drive.
  build:
    needs: resolve-version
    name: Flatcar
    uses: open-img-cloud/.github/.github/workflows/build-libguestfs-image.yml@main
    with:
      os_name: flatcar
      version: ${{ needs.resolve-version.outputs.version }}
      output_filename: 'flatcar-{version}-x86_64.qcow2'
      upstream_url: 'https://stable.release.flatcar-linux.net/amd64-usr/{version}/flatcar_production_openstack_image.img'
      upstream_signed_checksum_url: 'https://stable.release.flatcar-linux.net/amd64-usr/{version}/flatcar_production_openstack_image.img.DIGESTS.asc'
      upstream_gpg_key_url: 'https://www.flatcar.org/security/image-signing-key/Flatcar_Image_Signing_Key.asc'
      upstream_gpg_fingerprint: 'F88CFEDEFF29A5B4D9523864E25D9AED0593B34A'
      decompress: none
      passthrough: true
      contract: flatcar
      runtime_smoke_login_user: core
      publish: ${{ inputs.publish == true || github.event_name == 'push' }}
      sync_latest: true
    secrets: inherit
